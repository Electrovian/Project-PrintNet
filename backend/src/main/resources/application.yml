spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/printnet
    username: printnet
    password: printnet
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080