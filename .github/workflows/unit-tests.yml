name: unit-tests

on:
  workflow_dispatch:
  push:
    paths:
      - "App/**"
      - "Website/**"
      - "deploy/**"
      - "scripts/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "App/**"
      - "Website/**"
      - "deploy/**"
      - "scripts/**"
      - ".github/workflows/unit-tests.yml"

jobs:
  app-smoke:
    name: app-smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libgl1-mesa-dri \
            libglib2.0-0 \
            libglu1-mesa \
            libice6 \
            libnss3 \
            libopengl0 \
            libsm6 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxi6 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxrender1 \
            xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "App/requirements.txt"

      - name: Install App dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r App/requirements.txt

      - name: Run App smoke tests (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: software
          EON_OPENGL_MODE: software
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python App/Tests/run_tests.py --scope smoke

      - name: Run App smoke tests (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          EON_OPENGL_MODE: software
          QT_QUICK_BACKEND: software
        run: python App/Tests/run_tests.py --scope smoke

  app-full:
    name: app-full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libgl1-mesa-dri \
            libglib2.0-0 \
            libglu1-mesa \
            libice6 \
            libnss3 \
            libopengl0 \
            libsm6 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxi6 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxrender1 \
            xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "App/requirements.txt"

      - name: Install App dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r App/requirements.txt

      - name: Run App full tests with coverage gate (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: software
          EON_OPENGL_MODE: software
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          coverage erase
          xvfb-run -a -s "-screen 0 1920x1080x24" coverage run --source=App/slicer_v2,App/connectors,App/profiles_import --omit="App/slicer_v2/legacy_*.py,App/slicer_v2/legacy_slicer/*.py" -m App.Tests.run_tests --scope full
          coverage report --fail-under=80 -m

      - name: Run App full tests (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          EON_OPENGL_MODE: software
          QT_QUICK_BACKEND: software
        run: python App/Tests/run_tests.py --scope full

  website-backend-tests:
    name: website-backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "Website/backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Website/backend/requirements.txt
          python -m pip install coverage

      - name: Run backend tests with coverage gate
        run: |
          coverage erase
          coverage run --source=Website/backend/printnet_backend -m unittest discover -s Website/backend/tests -p "test_*.py"
          coverage report --fail-under=85 -m

  website-frontend-tests:
    name: website-frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "Website/frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: Website/frontend
        run: npm ci

      - name: Install c8 coverage tool
        working-directory: Website/frontend
        run: npm install --no-save c8

      - name: Run frontend tests with coverage gate
        working-directory: Website/frontend
        run: npx c8 --check-coverage --lines 75 --functions 75 --statements 75 node --test tests/*.test.mjs

  deploy-tests:
    name: deploy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage

      - name: Run deploy tests with coverage gate
        run: |
          coverage erase
          coverage run --source=deploy -m unittest discover -s deploy/tests -p "test_*.py"
          coverage report --fail-under=80 -m
