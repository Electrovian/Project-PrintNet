namespace:
  create: true
  name: printnet

ingress:
  enabled: true
  className: traefik
  host: printnet.local
  tls:
    enabled: false

backend:
  env:
    queueName: k3d-default
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

frontend:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi
