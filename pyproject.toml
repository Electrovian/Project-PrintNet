[build-system]
requires = ["briefcase"]
build-backend = "briefcase.integrations.build_systems.bootstrap.Bootstrap"

[tool.briefcase]
project_name = "EON-OpenSlicer"
bundle = "edu.uc"
version = "1.0.0"
url = "https://github.com/Electrovian/Project-EON-OpenSlicer"
license = "MIT"
author = "EON-OpenSlicer Team"
author_email = "koskima@mail.uc.edu"

[tool.briefcase.app.EON-OpenSlicer]
formal_name = "EON-OpenSlicer"
description = "A centralized 3D printing lab management system"
long_description = """EON-OpenSlicer is a centralized 3D printing lab management system designed to streamline the submission, tracking, and completion of print jobs."""
sources = ["App"]
icon = "App/assets/icons/app_icon"
splash = "App/assets/icons/app_icon"

# Main entry points
# Desktop platforms use PyQt5
[tool.briefcase.app.EON-OpenSlicer.macOS]
requires = [
    "PyQt5>=5.15.10",
    "PyQt5-stubs>=5.15.6",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.1",
    "trimesh>=4.0",
    "pyclipper>=1.3.0",
    "requests>=2.31",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyOpenGL>=3.1.7",
    "fast_simplification>=0.1.8",
]

[tool.briefcase.app.EON-OpenSlicer.linux]
requires = [
    "PyQt5>=5.15.10",
    "PyQt5-stubs>=5.15.6",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.1",
    "trimesh>=4.0",
    "pyclipper>=1.3.0",
    "requests>=2.31",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyOpenGL>=3.1.7",
    "fast_simplification>=0.1.8",
]
system_requires = [
    "libgl1-mesa-dev",
    "libglib2.0-dev",
    "libxkbcommon-x11-0",
    "libxcb-icccm4",
    "libxcb-image0",
    "libxcb-keysyms1",
    "libxcb-randr0",
    "libxcb-render-util0",
    "libxcb-xinerama0",
    "libxcb-xfixes0",
]

[tool.briefcase.app.EON-OpenSlicer.windows]
requires = [
    "PyQt5>=5.15.10",
    "PyQt5-stubs>=5.15.6",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.1",
    "trimesh>=4.0",
    "pyclipper>=1.3.0",
    "requests>=2.31",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyOpenGL>=3.1.7",
    "fast_simplification>=0.1.8",
]

# Mobile platforms use Toga for UI
[tool.briefcase.app.EON-OpenSlicer.iOS]
requires = [
    "toga>=0.4.0",
    "numpy>=1.24",
    "requests>=2.31",
]
supported = false
info_plist = {
    NSCameraUsageDescription = "This app needs camera access to scan QR codes for printer connection",
    NSPhotoLibraryUsageDescription = "This app needs photo library access to import 3D models",
}

[tool.briefcase.app.EON-OpenSlicer.android]
requires = [
    "toga>=0.4.0",
    "numpy>=1.24",
    "requests>=2.31",
]
supported = false
base_theme = "Theme.MaterialComponents.Light.DarkActionBar"
build_gradle_dependencies = [
    "androidx.appcompat:appcompat:1.6.1",
    "com.google.android.material:material:1.11.0",
]
permissions = [
    "android.permission.INTERNET",
    "android.permission.CAMERA",
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE",
]

[tool.briefcase.app.EON-OpenSlicer.web]
requires = [
    "toga>=0.4.0",
    "numpy>=1.24",
    "requests>=2.31",
]
supported = false
